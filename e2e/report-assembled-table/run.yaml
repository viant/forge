# Synthetic native assembly fixture, generated by the converter test.
# The orchestration supplies previewURL, debuggerAddress and fixtureHash from
# that exact generation. This workflow does not replace rows or start services.
pipeline:
  open:
    action: webdriver:open
    sessionID: assembled-table
    debuggerAddress: $debuggerAddress
    directCDP: true
    browser: chrome
  verify:
    action: webdriver:run
    sessionID: assembled-table
    autoStart: false
    commands:
      - get($previewURL/assembled-report-preview.html)
      - expect(page.locator(".forge-report-runtime-table-panel tbody tr")).toHaveCount("143", 10000)
      - expect("[data-testid='assembly-fixture-hash']").toContainText("$fixtureHash")
      - (xpath://button[@aria-label='Paginate High']).click
      - expect(page.locator(".forge-report-runtime-table-panel tbody tr")).toHaveCount("25", 10000)
      - expect("body").toContainText("Rows 1–25 of 143")
      - (xpath://button[normalize-space(.)='Next']).click
      - expect("body").toContainText("Rows 26–50 of 143")
      - (xpath://button[@aria-label='Sort by Amount']).click
      - (xpath://button[@aria-label='Sort by Amount']).click
      - expect("body").toContainText("Rows 1–25 of 143")
      - expect(".forge-report-runtime-table-panel tbody tr:first-child").toContainText("143")
      - expect("[data-testid='assembly-page-calls']").toContainText("0")
